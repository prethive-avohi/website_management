[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdcms_app"
version = "1.0.0"
description = "AI-powered multilingual headless CMS on Frappe"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "PyPDF2>=3.0.0",
    "python-docx>=1.1.0",
    "requests>=2.31.0",
    "jsonschema>=4.21.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"pdcms_app" = ["**/*.json", "**/*.txt"]
"public" = ["**/*.js", "**/*.css"]